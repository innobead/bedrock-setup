version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - staticcheck
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocritic:
      disabled-checks:
        - ifElseChain
formatters:
  enable:
    - gofmt
